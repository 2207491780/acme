# 派生自 .ai/ci/ci.yml（统一管理于 .ai/），请修改源文件后运行 node .ai/sync.mjs

name: ci
# 主门禁流水线 —— 源：.ai/ci/ci.yml（唯一事实源），由 .ai/sync.mjs 派生到 .github/workflows/。
# 接线说明见 .ai/ci/CI-GUIDE.md。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-config:
    name: AI 配置同步门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .ai/sync.mjs --check

  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: workspace/apps/backend/**/pom.xml
      # 冷启动先装 parent，再全量构建（Backend.md 6.4.3 / 6.4.1）
      - run: mvn -B -N install -f acme-parent/pom.xml
      - run: mvn -B -f acme-cloud/pom.xml clean install

  frontend:
    name: 前端检查与单测（web-admin）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/apps/frontend/web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workspace/apps/frontend/web-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:unit
