# 派生自 .ai/ci/ci.yml（统一管理于 .ai/），请修改源文件后运行 node .ai/sync.mjs

name: ci
# 主门禁流水线 —— 源：.ai/ci/ci.yml（唯一事实源），由 .ai/sync.mjs 派生到 .github/workflows/。
# 说明见 .ai/ci/CI-GUIDE.md。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-config:
    name: AI 配置同步门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .ai/sync.mjs --check
      - name: 派生引擎回归测试
        # 注意用 glob 形式：Windows/Node 24 下目录形式（node --test .ai/tests）会被当作入口模块而失败
        run: node --test ".ai/tests/*.test.mjs"

  app-quality:
    name: 应用构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          # 版本读自 packageManager 字段，避免双处维护
          package_json_file: workspace/apps/frontend/package.json
      - name: 安装依赖
        working-directory: workspace/apps/frontend
        env:
          # CI 不启动 Electron 窗口，跳过二进制下载以加速安装
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        working-directory: workspace/apps/frontend
        run: pnpm typecheck
      - name: 测试
        working-directory: workspace/apps/frontend
        run: pnpm test
      - name: 桌面壳层语法检查
        working-directory: workspace/apps/frontend
        run: pnpm --filter @acme/desktop check
      - name: 构建
        working-directory: workspace/apps/frontend
        run: pnpm build
