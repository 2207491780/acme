name: ci
# 主门禁流水线 —— 源：.ai/ci/ci.yml（唯一事实源），由 .ai/sync.mjs 派生到 .github/workflows/。
# 说明见 .ai/ci/CI-GUIDE.md。
on:
  # 全分支 push 触发：ai-config 门禁（轻量）前移到功能分支；app-quality 由作业级 if 限制在 main 直推与 PR
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-config:
    name: AI 配置同步门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .ai/sync.mjs --check
      - name: 派生引擎回归测试
        # 注意用 glob 形式：Windows/Node 24 下目录形式（node --test .ai/tests）会被当作入口模块而失败
        run: node --test ".ai/tests/*.test.mjs"

  mirror-sync:
    name: AI 配置镜像一致性
    # 仅两条策略分支触发：AI 路径必须与对方分支逐字节一致，差异 = 有变更未镜像（人工 cherry-pick/对齐后重推）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/acme-foundation' || github.ref == 'refs/heads/ai-coding-support')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验 AI 路径两分支一致
        run: |
          git diff --stat origin/ai-coding-support origin/acme-foundation -- \
            .ai .ai-memory .github .claude .cursor .gemini .iflow .trae .qoder \
            AGENTS.md CLAUDE.md GEMINI.md CODEBUDDY.md .gitignore \
            ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md'
          git diff --exit-code origin/ai-coding-support origin/acme-foundation -- \
            .ai .ai-memory .github .claude .cursor .gemini .iflow .trae .qoder \
            AGENTS.md CLAUDE.md GEMINI.md CODEBUDDY.md .gitignore \
            ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' || {
            echo "::error::AI 配置在两分支间存在差异——请把未镜像的一方对齐到另一方后重推。"
            exit 1
          }

  app-quality:
    name: 应用构建与测试
    # 重作业只在 main 直推与 PR 执行；功能分支 push 仅跑轻量 ai-config 门禁。
    # 注意：hashFiles 在 job 级 if 不可用（GitHub 限制，首跑实测），守卫下沉到 guard 步骤 + 各步骤级 if。
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 前端工程存在性守卫
        id: guard
        run: |
          if [ -f workspace/apps/frontend/pnpm-lock.yaml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::分支无前端工程（如 ai-coding-support），本作业整体跳过"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.run == 'true'
        with:
          # 版本读自 packageManager 字段，避免双处维护
          package_json_file: workspace/apps/frontend/package.json
      - name: 安装依赖
        if: steps.guard.outputs.run == 'true'
        working-directory: workspace/apps/frontend
        env:
          # CI 不启动 Electron 窗口，跳过二进制下载以加速安装
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        if: steps.guard.outputs.run == 'true'
        working-directory: workspace/apps/frontend
        run: pnpm typecheck
      - name: 测试
        if: steps.guard.outputs.run == 'true'
        working-directory: workspace/apps/frontend
        run: pnpm test
      - name: 桌面壳层语法检查
        if: steps.guard.outputs.run == 'true'
        working-directory: workspace/apps/frontend
        run: pnpm --filter @acme/desktop check
      - name: 构建
        if: steps.guard.outputs.run == 'true'
        working-directory: workspace/apps/frontend
        run: pnpm build

  backend-quality:
    name: 后端构建与测试
    # 与 app-quality 同口径：限 main 直推与 PR；分支无后端工程时守卫跳过。
    # PG 集成测试经 testcontainers 在 runner 的 Docker 中真实拉起容器（本机无 Docker 则跳过）
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 后端工程存在性守卫
        id: guard
        run: |
          if [ -f workspace/apps/backend/acme-cloud/pom.xml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::分支无后端工程（如 ai-coding-support），本作业整体跳过"
          fi
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 25
      - name: 构建与测试
        if: steps.guard.outputs.run == 'true'
        working-directory: workspace/apps/backend/acme-cloud
        run: mvn -B test
