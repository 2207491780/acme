# AI-Coding 行为/引擎开关 + 环境上下文 —— 唯一事实源：.ai/ai-coding-config.yml
# 由 .ai/sync.mjs 在派生/校验时读取（本文件是源，不派生；仿 .ai/env/）。改本文件后必须重跑 node .ai/sync.mjs。
# engine 只门控「可选的派生引擎行为」；AI 协作红线与强制规范在 .ai/rules/，不可在此关闭。
# environment 是本地调试环境的现状声明：AI 在调试任务前读取并遵循；引擎只校验、不消费。
# 核心派生（rules/入口/scopes/pools/tools/ci）是「全工具联动」铁律的保证，始终开启，不设开关。
# Schema 与取舍见 .ai/ARCHITECTURE.md「行为/引擎开关」与 .ai-memory/decisions/2026-11-12-06-ai-coding-config.md、2026-11-13-09-env-debug-target-config.md。
version: 1
engine:
  # 根部/分层入口默认形态：stub（引用存根，默认）| symlink（符号链接，磁盘零拷贝）。
  # CLI --links 或环境变量 AI_SYNC_LINK=1 优先于本值（强制 symlink）；无符号链接权限时自动降级为 stub。
  entryMode: stub
  # 是否在 sync/--check 扫描工具目录的孤儿派生文件（源已删、派生物残留）。关闭会削弱联动防线，默认开启。
  orphanDetection: true
  # .ai/RULES.md 拼接后的字节预算上限（正整数）。默认 8192（8KB）；本项目放宽至 10.5KB（取舍见
  # .ai-memory/decisions/2026-11-13-01-rules-budget.md、2026-11-22-01-rules-budget-10-5k.md）。当前字节/余量以 node .ai/sync.mjs --check 实测为准。
  rulesBudgetBytes: 10752
  # 蜂群触发模式：key = .ai/agents/ 下的蜂群名（如 ai-coding-dev、code-review），value = auto | always | never | manual。
  # auto=功能开发类任务自动触发；always=所有会产出业务代码的开发任务；
  # never=显式停用（仍注入一条停用提示）；蜂群键缺省（未配置）视为停用且不注入任何触发段；
  # manual=仅在用户对话显式要求时调用（无自动触发、无命令入口，如 code-review 评审蜂群）。
  # sync.mjs 只接受与现有蜂群目录同名的键（未知键报错）；每个蜂群键按档位注入一条入口存根触发段（不占 RULES.md 预算）。
  # auto/always/never 蜂群流程源见 .ai/skills/team-leader/ 与 .ai-memory/playbooks/multi-agent.md；
  # manual 蜂群流程源见 .ai/skills/code-review/SKILL.md；取舍见
  # .ai-memory/decisions/2026-11-14-19-multi-agent-contract-workflow.md、2026-11-26-01-agent-swarm-folders.md 与
  # 2026-11-26-02-code-review-swarm.md。
  ai-coding-dev: auto
  code-review: manual
environment:
  # 当前运行环境的定义文件（.ai/env/ 下的文件名，见名知意：local=本地中间件，cloud-*=云端 k3s）。
  # 本地调试（前后端在本地运行）时，后端连接该文件定义的运行环境；切换环境改此值并重跑 sync。
  file: cloud-dev.yaml