# platform-scheduler 应用配置（Backend.md 8.1.3 前缀 acme.*；14.3.1 本地仅启动级配置）
# 路径约定：Controller 映射含端别前缀 /admin/v1/scheduler/**（网关不 StripPrefix，架构设计 6.1 取舍 #8）；
# internal 面 /internal/v1/scheduler/** 不经网关（REQ-054613 先例，Result 信封）。
spring:
  application:
    name: platform-scheduler
  config:
    # 配置中心集中配置（FR-018；不可达显式失败 fail-fast，不静默缺省运行）
    import: nacos:platform-scheduler.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:acme_local_nacos_2026}
      # 命名空间（2026-11-18-02 单套 Nacos 三环境隔离；空 = 默认 namespace，与本地现状一致）
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        # Nacos 注册健康纳入就绪探针（14.2.2、架构设计 9.5；SCA 该指标缺省关）
        health-indicator:
          enabled: true
      config:
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    # 每服务独占 schema（12.1.1）与独立账号（12.1.3；本地开发取值对应 .dev-stack）
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:acme}?currentSchema=platform_scheduler
    username: ${PG_USER:acme}
    password: ${PG_PASSWORD:acme_local_pg_2026}
  flyway:
    enabled: true
    # 迁移脚本目录 per-service 化（REQ-20261118-002130 确认①）：scheduler 自 V1 起（契约 frontmatter
    # migrations 预分配），版本号跨服务各自协调；每服务只扫自己的子目录，分布式行为零变化
    locations: classpath:db/migration/scheduler
    default-schema: platform_scheduler
    schemas: platform_scheduler

server:
  port: 9884

acme:
  scheduler:
    # 调度内核参数（确认⑤终稿缺省；运维面调整经 Nacos data-id 覆盖）
    dispatch:
      # 下发接单超时（确认⑤：10s 未 200 视为下发失败走重试链）
      timeout-ms: 10000
    executor:
      # 心跳 stale 阈值（确认④：30s 无心跳视为 OFFLINE）
      heartbeat-stale-seconds: 30
  security:
    # 公开端点豁免（架构设计 6.2）：探针与指标面（14.2.1/14.2.2）直连放行——kubelet / 监控直连服务端口，
    # 网关不路由故无对外暴露
    public-paths:
      - /actuator/**
    token:
      # 内部令牌校验密钥域（与网关签发同源；14.3.3 经环境注入、不落仓库默认值——未注入即启动失败）
      hmac-secret: ${ACME_SECURITY_TOKEN_HMAC_SECRET}
  i18n:
    # zh/en 双语（NFR-007）：框架汇总资源 + 本服务资源（消息键=错误码，8.2）
    basenames: i18n/acme-messages,i18n/platform-scheduler-messages
  flex:
    id:
      # 雪花 worker 标识（12.3.1 必填；auth=1 / system=2 / infra=3 之后顺延防碰撞）
      worker-id: 4

management:
  endpoints:
    web:
      exposure:
        # 14.2.1 指标暴露 / 14.2.2 探针（FR-019 装配级验证）
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # 就绪探针校验关键依赖可用性（14.2.2、架构设计 9.5）：DB / Nacos
        readiness:
          include: readinessState,db,nacosDiscovery
