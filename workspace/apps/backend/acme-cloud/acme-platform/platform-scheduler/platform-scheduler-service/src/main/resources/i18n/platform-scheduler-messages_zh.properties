# platform-scheduler 错误提示（zh，键=错误码，NFR-007；与 SchedulerError 枚举一一对应）
# 01 任务定义域
platform-scheduler-01-0001=任务键已存在
platform-scheduler-01-0002=任务定义不存在
platform-scheduler-01-0003=任务键创建后不可修改
platform-scheduler-01-0004=触发参数非法
platform-scheduler-01-0005=重试策略非法
# 02 执行历史域
platform-scheduler-02-0001=执行记录不存在
platform-scheduler-02-0002=执行状态跃迁冲突
