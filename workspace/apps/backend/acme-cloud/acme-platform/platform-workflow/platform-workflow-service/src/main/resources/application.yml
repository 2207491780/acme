# platform-workflow 应用配置（Backend.md 8.1.3 前缀 acme.*；14.3.1 本地仅启动级配置）
# 路径约定：Controller 映射含端别前缀 /admin/v1/workflow/**（网关不 StripPrefix，架构设计 6.1 取舍 #8）；
# internal 面 /internal/v1/workflow/** 不经网关（REQ-054613 先例，Result 信封）。
spring:
  application:
    name: platform-workflow
  config:
    # 配置中心集中配置（FR-018；不可达显式失败 fail-fast，不静默缺省运行）
    import: nacos:platform-workflow.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:acme_local_nacos_2026}
      # 命名空间（2026-11-18-02 单套 Nacos 三环境隔离；空 = 默认 namespace，与本地现状一致）
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        # Nacos 注册健康纳入就绪探针（14.2.2、架构设计 9.5；SCA 该指标缺省关）
        health-indicator:
          enabled: true
      config:
        namespace: ${NACOS_NAMESPACE:}
    stream:
      # 流程事件流出站（REQ-20261122-233425 确认④：KafkaWorkflowEventPublisher 动态目标，
      # topic 归发布方约定 13.2.3——通知中心 BPM-6 复用本 topic 消费）
      bindings:
        workflowEventOut-out-0:
          destination: acme.workflow.events
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_ADDR:127.0.0.1:9092}
  datasource:
    # 每服务独占 schema（12.1.1）与独立账号（12.1.3；本地开发取值对应 .dev-stack）
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:acme}?currentSchema=platform_workflow
    username: ${PG_USER:acme}
    password: ${PG_PASSWORD:acme_local_pg_2026}
  flyway:
    enabled: true
    # 迁移脚本目录 per-service 化（REQ-20261118-002130 确认①）：workflow 自 V1 起（契约 frontmatter
    # migrations 预分配），版本号跨服务各自协调；每服务只扫自己的子目录，分布式行为零变化
    locations: classpath:db/migration/workflow
    default-schema: platform_workflow
    schemas: platform_workflow

server:
  port: 9883

acme:
  workflow:
    # BPM 引擎内核参数（BPM-1 契约终稿缺省；运维面调整经 Nacos data-id 覆盖）
    timer:
      # 定时兜底扫描轮询间隔毫秒（确认⑥本地 ScheduledExecutorService 兜底面）
      fallback-poll-ms: 5000
      # 注册失败重试间隔毫秒（确认⑥后台重试注册）
      retry-register-interval-ms: 10000
    delegate:
      # ServiceTask 委托缺省超时毫秒（acme:timeoutMs 未配置时取值）
      timeout-ms: 10000
      # 委托失败重试上限缺省（acme:retryMaxAttempts 未配置时取值；0=不重试）
      retry-max-attempts: 0
      # 重试首间隔毫秒缺省（acme:retryBackoffMs 未配置时取值）
      retry-backoff-ms: 1000
    identity:
      # 身份目录本地快照 TTL 毫秒（「流程引擎本地快照」方案——确认④配套）
      snapshot-ttl-ms: 30000
      # 快照条目上限（防御性）
      snapshot-max-entries: 5000
  security:
    # 公开端点豁免（架构设计 6.2）：探针与指标面（14.2.1/14.2.2）直连放行——kubelet / 监控直连服务端口，
    # 网关不路由故无对外暴露
    public-paths:
      - /actuator/**
    token:
      # 内部令牌校验密钥域（与网关签发同源；14.3.3 经环境注入、不落仓库默认值——未注入即启动失败）
      hmac-secret: ${ACME_SECURITY_TOKEN_HMAC_SECRET}
  i18n:
    # zh/en 双语（NFR-007）：框架汇总资源 + 本服务资源（消息键=错误码，8.2）
    basenames: i18n/acme-messages,i18n/platform-workflow-messages
  flex:
    id:
      # 雪花 worker 标识（12.3.1 必填；auth=1 / system=2 / infra=3 / scheduler=4 之后顺延防碰撞）
      worker-id: 5

management:
  endpoints:
    web:
      exposure:
        # 14.2.1 指标暴露 / 14.2.2 探针（FR-019 装配级验证）
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # 就绪探针校验关键依赖可用性（14.2.2、架构设计 9.5）：DB / Nacos
        readiness:
          include: readinessState,db,nacosDiscovery
