# platform-workflow 错误提示（zh，键=错误码，NFR-007；与 WorkflowError 枚举一一对应）
# 01 流程定义域
platform-workflow-01-0001=流程键已存在
platform-workflow-01-0002=BPMN XML 结构非法
platform-workflow-01-0003=流程结构校验未通过
platform-workflow-01-0004=流程定义不存在
platform-workflow-01-0005=流程定义已禁用
# 02 流程实例域
platform-workflow-02-0001=流程实例不存在
platform-workflow-02-0002=流程实例状态跃迁冲突
platform-workflow-02-0003=流程定义未部署或已禁用
platform-workflow-02-0004=业务键不能为空
# 03 任务域
platform-workflow-03-0001=任务不存在
platform-workflow-03-0002=任务状态跃迁冲突
platform-workflow-03-0003=无权操作该任务
platform-workflow-03-0004=任务委派状态非法
platform-workflow-03-0005=任务无可用候选人
