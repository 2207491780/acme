# platform-infra 测试域配置（遮蔽主 application.yml：无 Nacos 导入，16.2.1 测试不依赖共享环境）
# stream/audit 关闭：单元与集成域不依赖 Kafka/Redis（可关闭性，Modules.md 3.5）
spring:
  application:
    name: platform-infra
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  flyway:
    enabled: true
    default-schema: public
    schemas: public

acme:
  stream:
    enabled: false
  audit:
    enabled: false
  security:
    public-paths: []
    token:
      hmac-secret: infra-it-secret-0123456789abcdef
  i18n:
    basenames: i18n/acme-messages,i18n/platform-infra-messages
  jpa:
    id:
      worker-id: 3

management:
  endpoint:
    health:
      probes:
        enabled: true
