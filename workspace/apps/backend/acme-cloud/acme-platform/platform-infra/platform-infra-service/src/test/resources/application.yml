# platform-infra 测试域配置（遮蔽主 application.yml：无 Nacos 导入，16.2.1 测试不依赖共享环境）
# stream/audit 关闭：单元与集成域不依赖 Kafka/Redis（可关闭性，Modules.md 3.5）
spring:
  application:
    name: platform-infra
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    function:
      definition: ""
    stream:
      # 测试域无 Kafka broker：禁止 SCSt 自动探测 auditEventIn 消费函数并绑定 Kafka，
      # 消除每次上下文启动 60s AdminClient localhost:9092 空转超时
      function:
        autodetect: false
      enabled: false
  flyway:
    enabled: true
    # locations 继承 yml（REQ-20261118-002130 确认①）：迁移目录 per-service 子目录，测试不另覆盖
    locations: classpath:db/migration/infra
    default-schema: public
    schemas: public

acme:
  stream:
    enabled: false
  audit:
    enabled: false
  security:
    public-paths: []
    token:
      hmac-secret: infra-it-secret-0123456789abcdef
  i18n:
    basenames: i18n/acme-messages,i18n/platform-infra-messages
  flex:
    id:
      worker-id: 3

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    binders:
      enabled: false
