# platform-auth 测试域配置（遮蔽主 application.yml：无 Nacos 导入，16.2.1 测试不依赖共享环境）
spring:
  application:
    name: platform-auth
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  flyway:
    enabled: true
    # locations 继承 yml（REQ-20261118-002130 确认①）：迁移目录 per-service 子目录，测试不另覆盖
    locations: classpath:db/migration/auth
    default-schema: public
    schemas: public
    placeholders:
      # 种子密码占位（Q-D05 测试取值，非生产）
      seedSuperadminPassword: "Admin@123456"
      # 演示账号种子密码（business-api-integration 测试取值，非生产；主配置无仓库内缺省值）
      seedDemoAdminPassword: "DemoAdmin@123456"
      seedDemoOperatorPassword: "DemoOperator@123456"

acme:
  security:
    public-paths:
      - /admin/v1/auth/tokens
      - /admin/v1/auth/captcha
      - /admin/v1/auth/captcha-policy
      # 公开站点配置豁免（REQ-20261117-025200 确认记录⑤；与主配置/网关豁免清单一致）
      - /admin/v1/auth/public-config
      - /admin/v1/auth/tenants
      # 扫码票据创建 + 单段通配轮询（REQ-20261119-040838 确认记录④；与主配置/网关豁免清单一致）
      - /admin/v1/auth/qr-tickets
      - /admin/v1/auth/qr-tickets/*
    token:
      # ≥32 字节（jjwt HS256 密钥下限 256 位，31 字符取值会在 WeakKey 下启动失败）
      hmac-secret: auth-it-secret-0123456789abcdef0000
  auth:
    token:
      hmac-secret: auth-it-secret-0123456789abcdef0000
      issuer: acme-auth
      ttl-seconds: 1800
    login:
      max-failures: 5
      window-seconds: 900
      lock-seconds: 900
  i18n:
    basenames: i18n/acme-messages,i18n/platform-auth-messages
  flex:
    id:
      worker-id: 1

management:
  endpoint:
    health:
      probes:
        enabled: true
