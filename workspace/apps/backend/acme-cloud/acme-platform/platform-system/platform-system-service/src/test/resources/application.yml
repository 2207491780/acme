# platform-system 测试域配置（遮蔽主 application.yml：无 Nacos 导入，16.2.1 测试不依赖共享环境）
spring:
  application:
    name: platform-system
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  flyway:
    enabled: true
    # locations 继承 yml（REQ-20261118-002130 确认①）：迁移目录 per-service 子目录，测试不另覆盖
    locations: classpath:db/migration/system
    default-schema: public
    schemas: public

acme:
  storage:
    # 仅绑定租户配额平台缺省值（REQ-20261122-150802 确认③，AMB-2：缺省 1GiB 断言锚）；
    # 适配器装配面关闭（同主配置口径，测试上下文无根目录/桶面）
    enabled: false
  security:
    public-paths: []
    token:
      hmac-secret: system-it-secret-0123456789abcdef
  i18n:
    basenames: i18n/acme-messages,i18n/platform-system-messages
  flex:
    id:
      worker-id: 2
  notify:
    ws:
      # WS 握手用户令牌验签（REQ-20261114-120102）：测试占位密钥，非生产取值（14.3.3 口径）；
      # 无 Redis 环境下扇出订阅建立失败由 NotifyPushBus 防御化捕获，不阻断上下文启动
      idle-timeout: 30s
      sweep-interval: 2s
  gateway:
    user-token:
      # 与网关同键单源（确认记录⑬）：测试占位密钥，非生产取值
      hmac-secret: notify-ws-handshake-test-secret-0123456789abcdef
      issuer: acme-auth
  rls:
    it:
      # RLS 铁证角色 acme_rls_app 的 PG IT 联调口令（REQ-20261127-234335 决策⑥）：V37 收口后迁移内
      # NOLOGIN + 口令清空，登录由测试夹具在 Flyway 迁移完成后经本键注入重开。值为测试联调专用随机串，
      # 禁止复用 V33 历史明文、禁止回填为任何生产口令；环境变量 ACME_RLS_IT_ROLE_PASSWORD 可覆盖。
      role-password: rls-it-6e0485df4d9dd5010cf54031ba0b04ce

management:
  endpoint:
    health:
      probes:
        enabled: true
