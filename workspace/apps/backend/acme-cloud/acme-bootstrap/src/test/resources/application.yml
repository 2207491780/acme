# acme-bootstrap 测试域配置（遮蔽主 application.yml：无 Nacos 导入，16.2.1 测试不依赖共享环境）；
# 形态开关镜像主配置（单体面），三服务键经 application-monolith.yml 导入（同主配置路径），
# 容器面（datasource/redis/种子密码/存储根目录）由 MonolithContextSmokeTest @DynamicPropertySource 注入。
spring:
  application:
    name: acme-monolith
  main:
    # 同主配置（AuthorizationClient 双声明消解，见 application.yml 注）
    allow-bean-definition-overriding: true
  config:
    import: optional:classpath:application-monolith.yml
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
        health-indicator:
          enabled: false
    function:
      definition: ""
    stream:
      enabled: false
      # 事件流出/入站绑定（REQ-20261122-233425，镜像主 yml：stream 关闭态键面惰性无害，
      # tester E2E 等开启 stream 的测试域直接生效；主 yml 被本文件遮蔽故须在此重申）
      bindings:
        workflowEventOut-out-0:
          destination: acme.workflow.events
          content-type: application/json
        leaveEventIn-in-0:
          destination: acme.workflow.events
          group: acme-monolith
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_ADDR:127.0.0.1:9092}
        bindings:
          leaveEventIn-in-0:
            consumer:
              # 死信通道（13.2.2 必配；DlqConfigValidator 启动校验）
              enable-dlq: true
              dlq-name: acme.workflow.events-dlq
    openfeign:
      lazy-attributes-resolution: true
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 20MB

acme:
  stream:
    enabled: false
  workflow:
    service-task:
      # BPM 集成 SDK（REQ-20261122-233425 确认⑥，镜像主 yml）：单体聚合内 SDK 接收端点——
      # 引擎下发经 localhost 直连，SDK 自动回调同机 internal 面。
      # ⚠️ 占位符解析时序：@Value 构造期与 @ConfigurationProperties 绑定期（均早于 Web 启动）
      # 同样烘焙 ${local.server.port} 为字面 :0——含 RANDOM_PORT 运行期占位符的键值只能经
      # Environment 发送期原始读取+解析消费（WorkflowServiceTaskCallbackClient.resolveBase /
      # LeavePilotProcessDeployer 部署期惰性读取口径），禁经 bean 值/@Value 链消费
      callback-base-url: http://127.0.0.1:${local.server.port:${server.port}}
      # 自动回调主体（X-Acme-Token sub=业务服务名；聚合内试点业务域=business-leave）
      service-name: business-leave
      # 单体聚合形态 handler 与引擎同 JVM——异步受理（状态链序可观测：APPROVING=审批办结后、
      # FILED=HR 备案落库时），handler 异常不反噬下发；分布式形态缺省同步
      receive-async: true
      receive-initial-delay-ms: 4000
      receive-callback-delay-ms: 1000
  leave:
    # 试点 handler 注册键=试点 BPMN serviceRef（LeaveFileServiceTaskHandler 收集器时点解析 +
    # LeavePilotProcessDeployer 部署期解析——同键单源；local.server.port 运行期可达）
    service-ref: http://127.0.0.1:${local.server.port:${server.port}}
  flex:
    id:
      worker-id: 1
  security:
    token:
      hmac-secret: monolith-it-secret-0123456789abcdef
  gateway:
    user-token:
      hmac-secret: monolith-it-user-token-secret-0123456789abcdef
      issuer: acme-auth
  auth:
    token:
      hmac-secret: monolith-it-user-token-secret-0123456789abcdef
      issuer: acme-auth
      ttl-seconds: 1800

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    binders:
      # 同主配置（stream 关闭形态下关闭 binder 健康指标，防 kafka 占位 broker 空转）
      enabled: false
