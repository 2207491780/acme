# acme-gateway 应用配置（Backend.md 11.1；路由归应用面 8.10）
# 注：SCG 5.x WebFlux 变体配置前缀为 spring.cloud.gateway.server.webflux（开发时按 BOM 核验，4.1）
# platform-services-bootstrap：移除 P3 验收残留路由 sample-admin / sample-app / sample-admin-gray
# 与公开路径 /admin/sample/test-token（Q-D07，验收应用已随 foundation-refactor 清理）；
# 追加 platform-auth / platform-system 按能力域路由（11.1.4，FR-010）。
spring:
  application:
    name: acme-gateway
  data:
    redis:
      # 撤销集直查（review 修复：此前未配置 Redis 连接，撤销检查恒异常，
      # 即时失效特性被 FAIL_OPEN 静默架空；连接失败仍按 FAIL_OPEN 放行）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ACL 用户名 + DB index（2026-11-18-02 单套 Redis 三环境隔离：每环境独立 ACL 用户与
      # DB index；username 空 = 默认用户仅密码认证，与本地 .dev-stack 现状一致）
      username: ${REDIS_USERNAME:}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:acme_local_redis_2026}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      # 注册与凭证经环境 / 配置中心注入（14.3.3；本地开发默认值仅连 .dev-stack）
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:acme_local_nacos_2026}
      # 命名空间（2026-11-18-02 单套 Nacos 三环境隔离；空 = 默认 namespace，与本地现状一致）
      discovery:
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      server:
        webflux:
          # 路由按能力域注册（11.1.4）；uri 用 lb://（Nacos 服务发现，FR-018）
          routes:
            - id: platform-auth
              uri: lb://platform-auth
              predicates:
                - Path=/admin/v1/auth/**
            - id: platform-system
              uri: lb://platform-system
              predicates:
                - Path=/admin/v1/system/**
            # WS 实时推送路由（REQ-20261114-120102）：SCG 原生支持 ws 升级代理；握手鉴权在
            # platform-system 侧 NotifyHandshakeInterceptor（用户令牌验签，确认记录④）——
            # /ws 前缀不在端别（/admin|/app）作用域，网关验签链不适用，服务侧握手为唯一强制门
            - id: platform-system-ws
              uri: lb://platform-system
              predicates:
                - Path=/ws/system/**
            # platform-infra 增补路由（仅追加不改既有，11.1.4；platform-infra-audit）
            - id: platform-infra
              uri: lb://platform-infra
              predicates:
                - Path=/admin/v1/infra/**
            # 调度中心路由（REQ-20261121-071002 确认⑥：/admin/v1/scheduler/** → lb://platform-scheduler，
            # 仅追加不改既有；/internal/v1/scheduler/** 不进网关路由白名单，服务间直连）
            - id: platform-scheduler
              uri: lb://platform-scheduler
              predicates:
                - Path=/admin/v1/scheduler/**
            # BPM 工作流路由（REQ-20261121-142316 确认⑧：/admin/v1/workflow/** → lb://platform-workflow，
            # 仅追加不改既有；/internal/v1/workflow/** 不进网关路由白名单，服务间直连）
            - id: platform-workflow
              uri: lb://platform-workflow
              predicates:
                - Path=/admin/v1/workflow/**
            # C 端认证路由（仅追加，11.1.3 双端前缀路由；consumer-auth-refresh-dataperm）
            - id: platform-auth-app
              uri: lb://platform-auth
              predicates:
                - Path=/app/v1/auth/**
            # 聚合 API 文档转发路由（REQ-20261114-120106、AC-2）：/v3/api-docs/{service} → lb://platform-{service}
            # 的 openapi JSON（SetPath 归位到服务侧 springdoc 端点）；开关 acme.doc.enabled=false 时
            # DocGuardFilter（order 50）前置拒绝 404 DOC_DISABLED，请求不触达下游服务
            - id: platform-auth-doc
              uri: lb://platform-auth
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - SetPath=/v3/api-docs
            - id: platform-system-doc
              uri: lb://platform-system
              predicates:
                - Path=/v3/api-docs/system
              filters:
                - SetPath=/v3/api-docs
            - id: platform-infra-doc
              uri: lb://platform-infra
              predicates:
                - Path=/v3/api-docs/infra
              filters:
                - SetPath=/v3/api-docs
            # 调度中心文档转发路由（REQ-20261121-071002 确认⑥：springdoc 分组 /v3/api-docs/scheduler）
            - id: platform-scheduler-doc
              uri: lb://platform-scheduler
              predicates:
                - Path=/v3/api-docs/scheduler
              filters:
                - SetPath=/v3/api-docs
            # BPM 工作流文档转发路由（REQ-20261121-142316 确认⑧：springdoc 分组 /v3/api-docs/workflow）
            - id: platform-workflow-doc
              uri: lb://platform-workflow
              predicates:
                - Path=/v3/api-docs/workflow
              filters:
                - SetPath=/v3/api-docs
          # 跨域归网关统一处理（BR-011、8.9、AC-026）；origin 白名单经环境注入（11.1.1 生产形态），
          # 通配仅限开发默认，生产必须以 ACME_CORS_ALLOWED_ORIGINS 注入显式白名单
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: "${ACME_CORS_ALLOWED_ORIGINS:*}"
                allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
                allowedHeaders: "${ACME_CORS_ALLOWED_HEADERS:*}"
                maxAge: 3600

server:
  port: 9888

# 聚合 API 文档 UI（REQ-20261114-120106、AC-1）：网关自身不产出 openapi（api-docs.enabled=false），
# UI 入口 /docs 按服务分组下拉（urls 对应 doc 转发路由）；swagger-ui.enabled 绑定 acme.doc.enabled
# 单一配置源开关——false 时 /docs 与 /swagger-ui/** 404（springdoc 端点不注册）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: ${acme.doc.enabled:true}
    path: /docs
    urls:
      - name: auth
        url: /v3/api-docs/auth
      - name: system
        url: /v3/api-docs/system
      - name: infra
        url: /v3/api-docs/infra
      - name: scheduler
        url: /v3/api-docs/scheduler
      - name: workflow
        url: /v3/api-docs/workflow

acme:
  gateway:
    auth:
      b:
        public-paths:
          # 公开豁免最小集（FR-012）：登录端点 + 图形验证码 + 租户目录 + 验证码策略 + 公开站点配置
          # （login-guard-captcha / login-tenant-select / REQ-20261117-011514 captcha-policy /
          # REQ-20261117-025200 public-config 页脚版权）+ 扫码票据创建/轮询（REQ-20261119-040838
          # 确认记录④：精确创建路径 + 单段通配轮询；info/confirm/cancel 双段后缀仍验签）；
          # 默认全部路由验签
          - /admin/v1/auth/captcha
          - /admin/v1/auth/captcha-policy
          - /admin/v1/auth/public-config
          - /admin/v1/auth/tenants
          - /admin/v1/auth/tokens
          - /admin/v1/auth/qr-tickets
          - /admin/v1/auth/qr-tickets/*
      c:
        public-paths:
          # C 端公开豁免最小集（11.4：验证码 / 登录 / 刷新自证；consumer-auth-refresh-dataperm）
          - /app/v1/auth/captcha
          - /app/v1/auth/tokens
          - /app/v1/auth/tokens/refresh
    user-token:
      # 用户令牌密钥域（11.6.2 与内部令牌密钥域隔离；14.3.3 经环境注入、不落仓库默认值——
      # 未注入即启动失败（TokenKeys 空密钥显式失败）；与 platform-auth acme.auth.token.hmac-secret 同值——auth 为签发方）
      hmac-secret: ${ACME_USER_TOKEN_HMAC_SECRET}
      issuer: acme-auth
    revocation:
      # 撤销检查异常兜底（Q-D02 子项）：缺省 FAIL_OPEN 可用性优先（本地/开发形态）；
      # prod 经 acme-app-config 注入 ACME_GATEWAY_REVOCATION_ON_ERROR=FAIL_CLOSE
      # （REQ-20261127-161433 P2-08：Redis 抖动期已撤销令牌继续可用不可接受；
      # 回滚前提与操作见 env-stack/RUNBOOK.md §8——Redis 可用性恢复前 FAIL_CLOSE 会把
      # 存储故障放大为全端 403，不得在故障期回滚切换）
      on-error: ${ACME_GATEWAY_REVOCATION_ON_ERROR:FAIL_OPEN}
    ratelimit:
      # 按端限流默认策略显式化（FR-014 / Q-006 裁定 B；framework-gateway 既有默认值，静态可核对 AC-012）
      b:
        quota-per-minute: 120
      c:
        quota-per-minute: 240
      fallback:
        # 公开端点 / 未鉴权流量兜底（IP + 接口，Modules.md 3.1.3）
        quota-per-minute: 60
  security:
    token:
      # 内部令牌密钥域：与下游校验同源（7.7；14.3.3 经环境注入、不落仓库默认值）；与用户令牌密钥域隔离（11.6.2）
      hmac-secret: ${ACME_SECURITY_TOKEN_HMAC_SECRET}
