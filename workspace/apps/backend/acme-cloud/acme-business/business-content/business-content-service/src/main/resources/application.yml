# business-content 应用配置（Backend.md 8.1.3 前缀 acme.*；14.3.1 本地仅启动级配置）
# 路径约定：Controller 映射含端别前缀 /app/v1/** 与 /admin/v1/**（网关不 StripPrefix，platform-auth 同款）
spring:
  application:
    name: business-content
  config:
    # 配置中心集中配置（18.1.1 第 7 步；不可达显式失败 fail-fast，不静默缺省运行）
    import: nacos:business-content.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:acme_local_nacos_2026}
      discovery:
        # Nacos 注册健康纳入就绪探针（14.2.2；SCA 该指标缺省关）
        health-indicator:
          enabled: true
  datasource:
    # 每服务独占 schema（12.1.1）与独立账号（12.1.3；本地开发取值对应 .dev-stack）
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:acme}?currentSchema=business_content
    username: ${PG_USER:acme}
    password: ${PG_PASSWORD:acme_local_pg_2026}
  jpa:
    hibernate:
      # 12.3.3：生产口径 validate，schema 唯一来源为 Flyway 脚本
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    default-schema: business_content
    schemas: business_content

server:
  port: 9883

acme:
  security:
    # 服务侧公开豁免最小集（Q-12=A，与网关 c.public-paths 双侧一致）：C 端读接口仅 GET 路径，
    # 本服务在这些路径仅暴露 GET 端点（豁免等效仅 GET）；B 端全部接口需认证
    public-paths:
      - /app/v1/feeds
      - /app/v1/hot-searches
      - /app/v1/contents/**
      - /app/v1/search/**
      - /app/v1/categories
      # 探针与指标面（14.2.1/14.2.2）：kubelet / 监控直连服务端口，网关不路由故无对外暴露
      - /actuator/**
    token:
      # 内部令牌校验密钥域（与网关签发同源；14.3.3 经环境注入）
      hmac-secret: ${ACME_SECURITY_TOKEN_HMAC_SECRET:a8f3c2b19d4e7a6f0c5b8d3e9f2a7b4c6d8e1f3a5c7b9d1e2f4a6c8b0d2e4f6a}
  feign:
    # 远程调用超时显式设置（10.4.2，禁用框架默认值口径）：权限判定轻量读，上游（网关）超时 > 本值（10.4.1）
    connect-timeout-millis: 2000
    read-timeout-millis: 3000
  i18n:
    # zh/en 双语（架构设计 4.2）：框架汇总资源 + 本服务资源（消息键=错误码）
    basenames: i18n/acme-messages,i18n/business-content-messages
  jpa:
    id:
      # 雪花 worker 标识（12.3.1 必填；auth=1 / system=2 / infra=3，本服务取 4 防碰撞）
      worker-id: 4

management:
  endpoints:
    web:
      exposure:
        # 14.2.1 指标暴露 / 14.2.2 探针
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # 就绪探针校验关键依赖可用性（14.2.2）：DB / Nacos
        readiness:
          include: readinessState,db,nacosDiscovery
