# @acme/web 容器内 nginx —— 静态站 + 同源反代网关
# web 的 CSP 为 connect-src 'self'，API 必须同源；由 nginx 把 /admin /app 反代到 acme-gateway，
# 消除 CORS。上游为集群内 Service DNS（nginx-unprivileged 监听 8080 非 root 端口）。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /admin/ {
        proxy_pass http://acme-gateway:9888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://acme-gateway:9888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 对象存储同源反代样例（REQ-20261117-045754 交付，未部署未实测，当前不启用）：
    # MINIO/OSS 直传启用时取消注释——预签名 PUT URL 需落在同源域名（CSP connect-src 'self'），
    # proxy_pass 带尾斜杠剥离前缀；Host 头必须保留原值（预签名含 Host）；
    # acme.storage.endpoint 相应配公网同源地址（https://<host>/object-storage），口径见 env-stack/ENV-STACK.md。
    # location /object-storage/ {
    #     proxy_pass http://minio:9000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 12m;
    # }
}
