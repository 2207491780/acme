# @acme/web 容器内 nginx —— 静态站 + 同源反代网关
# web 的 CSP 为 connect-src 'self'，API 必须同源；由 nginx 把 /admin /app 反代到 acme-gateway，
# 消除 CORS。上游为集群内 Service DNS（nginx-unprivileged 监听 8080 非 root 端口）。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /admin/ {
        proxy_pass http://acme-gateway:9888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://acme-gateway:9888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
