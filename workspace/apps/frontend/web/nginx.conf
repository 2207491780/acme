# @acme/web 容器内 nginx —— 静态站 + 同源反代网关
# web 的 CSP 为 connect-src 'self'，API 必须同源；由 nginx 把 /admin /app 反代到 acme-gateway，
# 消除 CORS。上游为集群内 Service DNS（nginx-unprivileged 监听 8080 非 root 端口）。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /admin/ {
        proxy_pass http://acme-gateway:9888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://acme-gateway:9888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 对象存储同源反代（REQ-20261117-045754，2026-11-19 启用实测）：MINIO 直传预签名 URL 落同源
    # 域名（CSP connect-src 'self'）。⚠️ 存储 SDK 不允许 endpoint 带路径（no path allowed）——
    # endpoint 为裸域名 http://acmecloud.site，预签名 URL 形如 /acme-prod/<object>?X-Amz-*，
    # 故按桶路径反代（proxy_pass 不带 URI，原始路径透传，S3 签名路径不被破坏）；
    # Host 头必须保留原值（预签名含 Host）；桶名变更须同步改本 location。
    location /acme-prod/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }
}
