# test overlay —— 按需部署（与 dev 抢 4G 内存，部署前建议先停掉 dev：
# kubectl scale deployment --all --replicas=0 -n acme-dev）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: acme-test
resources:
  - ../../base
  # REQ-20261114-071607：platform-infra 文件服务 storage root 持久卷（与 dev 同型；缺注入启动即失败）
  - platform-infra-storage.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: acme
      acme.io/env: test
    includeSelectors: false
patches:
  - path: platform-infra-storage-patch.yaml
    target:
      kind: Deployment
      name: platform-infra
  - path: ingress-host.yaml
    target:
      kind: Ingress
      name: acme-web
