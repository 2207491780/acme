# prod overlay —— CORS 收紧为显式白名单（覆盖 base 的通配默认；域名按实际替换）
# 部署审批走二期 CI 的 GitHub Environments required reviewers（决策 2026-11-13-06）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: acme-prod
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/part-of: acme
      acme.io/env: prod
    includeSelectors: false
configMapGenerator:
  - name: acme-app-config
    behavior: merge
    literals:
      - ACME_CORS_ALLOWED_ORIGINS=https://acme.example.com
patches:
  - path: ingress-host.yaml
    target:
      kind: Ingress
      name: acme-web
