# platform-infra 文件服务 storage root 持久卷（REQ-20261114-071607 §变更清单 env-stack 节；prod 启用
# LOCAL 落盘，沿用 dev 实测模式，ADR 2026-11-18-02）：本地盘对象存储落盘根，k3s 缺省 StorageClass
# （local-path）自动供给——真实宿主机路径在节点 /var/lib/rancher/k3s/storage 下，不入库（部署环境态）。
# ⚠️ 缺省 StorageClass 的回收策略为 Delete：删除 PVC 前先缩容 platform-infra，避免误删文件数据。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-infra-storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
