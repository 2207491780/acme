# prod Ingress host 覆盖（acmecloud.site 已 A 记录指向服务器；443 预留，TLS 未启用见决策 2026-11-14-25）
# paths 全量覆盖 base（host 变更即整列替换）：/ws 路由须与本文件同步登记（REQ-20261114-120102，
# /ws 直连网关——WebSocket 升级不经 acme-web 反代，Traefik 原生透传，语义见 base/ingress.yaml 头注）；
# TLS 上线后 wss:// 走同一 ingress 路径，无需再改本文件
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-web
spec:
  rules:
    - host: acmecloud.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: acme-web
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: acme-gateway
                port:
                  number: 9888
