# prod Ingress 覆盖（2026-11-19）——无 host 的 catch-all 规则：任何 Host 头均路由到 web/网关，
# 覆盖三种访问方式：① http://acmecloud.site（域名直连，已备案）；② hosts 文件改绑
# （<IP> acmecloud.site）；③ 纯 IP 直访 http://124.223.118.235 / http://43.143.83.112
# （Host=IP，不触发域名备案拦截——备案异常时的兜底入口，2026-11-18 用户定向）。
# 443 预留，TLS 未启用见决策 2026-11-14-25；paths 全量覆盖 base：/ws 路由须与本文件同步登记
# （REQ-20261114-120102，/ws 直连网关——WebSocket 升级不经 acme-web 反代，Traefik 原生透传，
# 语义见 base/ingress.yaml 头注）；TLS 上线后 wss:// 走同一 ingress 路径，无需再改本文件
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: acme-web
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: acme-gateway
                port:
                  number: 9888
