# dev Ingress host 覆盖（DNS 控制台加 dev.acmecloud.site A 记录指向服务器 IP 后可直接访问；
# 无 DNS 记录时 hosts 文件指向服务器 IP 兜底）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-web
spec:
  rules:
    - host: dev.acmecloud.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: acme-web
                port:
                  number: 80
