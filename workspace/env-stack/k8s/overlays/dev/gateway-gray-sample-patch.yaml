# acme-gateway Deployment 补丁：灰度用户选择器样例规则（REQ-20261114-120106，裁决⑤：经文件配置下发）。
# 变量 ↔ 服务属性对应（Spring relaxed binding）：ACME_GATEWAY_GRAY_* → acme.gateway.gray.*。
# acme.gateway.gray.enabled 默认 false（base 不注入=与未引入一致）；本补丁仅 dev 演示灰度开启形态：
# 命中=userId 白名单（精确匹配）或确定性哈希比例（SHA-256("acme-gray:"+userId) 前 8 字节无符号大端序模 100 < percent）。
# 命中请求由网关注入 X-Acme-Gray: on（acme.gateway.gray.header 默认值，未改）；SCG 路由谓词按需消费。
# 关闭灰度：移除本补丁（kustomization.yaml patches 段同步删除），恢复 base 缺省关闭。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: ACME_GATEWAY_GRAY_ENABLED
              value: "true"
            - name: ACME_GATEWAY_GRAY_USERS
              value: dev-admin-1,dev-admin-2
            - name: ACME_GATEWAY_GRAY_PERCENT
              value: "20"
