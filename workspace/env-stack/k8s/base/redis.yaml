# Redis —— 纯缓存用途（验证码/防爆破计数），不持久化；内存限额 64Mi
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      imagePullSecrets:
        - name: acme-registry-auth
      containers:
        - name: redis
          image: redis:7-alpine
          command: [sh, -c]
          args:
            - exec redis-server --requirepass "$REDIS_PASSWORD" --maxmemory 48mb --maxmemory-policy allkeys-lru --save ""
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: acme-app-secrets, key: REDIS_PASSWORD }
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: [sh, -c, redis-cli -a "$REDIS_PASSWORD" ping | grep PONG]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, redis-cli -a "$REDIS_PASSWORD" ping | grep PONG]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
