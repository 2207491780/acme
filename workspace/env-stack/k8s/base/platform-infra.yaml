# platform-infra-service（9880）—— PG schema platform_infra + Redis（幂等/锁）
# 文件服务 storage root（ACME_STORAGE_LOCAL_ROOT_DIR，REQ-20261114-071607）由 dev/test overlay
# 注入 + PVC 挂载（base 不含：prod 是否启用待生产存储选型，见 prod overlay 注释）。
apiVersion: v1
kind: Service
metadata:
  name: platform-infra
  labels:
    app: platform-infra
spec:
  selector:
    app: platform-infra
  ports:
    - name: http
      port: 9880
      targetPort: 9880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-infra
  template:
    metadata:
      labels:
        app: platform-infra
    spec:
      imagePullSecrets:
        - name: acme-registry-auth
      containers:
        - name: infra
          image: acme/platform-infra
          envFrom:
            - configMapRef:
                name: acme-app-config
            - secretRef:
                name: acme-app-secrets
          env:
            # 服务级覆盖共享 acme-app-config 的 JAVA_TOOL_OPTIONS（k8s 规则：env 优先于 envFrom）。
            # framework-excel/job/storage 接线（3bef39b）后启动期类加载超出共享 96m 元空间上限，
            # dev 实测 OOM Metaspace 崩溃循环（2026-11-14）；扩到 192m 并下调 MaxRAMPercentage=40，
            # 保证 heap(205Mi)+metaspace(192Mi)+JVM 开销 < 512Mi 容器限额。
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=40 -XX:MaxMetaspaceSize=192m"
          ports:
            - containerPort: 9880
              name: http
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9880
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9880
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9880
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              # 320Mi 时实测贴线（316Mi）导致 OOM 重启，扩到 384Mi；384Mi 后 framework-excel/job
              # 接线使启动期 Metaspace 超 96m 上限（OOM Metaspace 崩溃循环，2026-11-14 dev），
              # 扩到 512Mi 并按服务覆盖 JVM 参数（见上方 env 注释）
              memory: 512Mi
