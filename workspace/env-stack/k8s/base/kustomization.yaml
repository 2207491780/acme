# Kustomize base —— 环境无关资源；环境差异走 overlays/{prod,monolith}（dev/test 云端已退役，
# 本地服务经 dev-tunnel 连中间件 dev 隔离面，见 RUNBOOK §9）
# 镜像名统一 acme/<服务>:latest 占位，由 deploy.sh 向 overlay kustomization 追加 images 段换成 TCR 实际地址。
# 敏感值不入库：Secret `acme-app-secrets` 与 `acme-registry-auth` 由 deploy.sh 从服务器 .env 创建。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - redis.yaml
  - nacos.yaml
  # REQ-20261117-045754 对象存储（2026-11-19 启用并实测打通）：MinIO 单实例（数据面），桶按环境
  # 隔离（acme-prod / acme-dev）；服务侧 acme.storage.type=minio 经 Nacos data-id 注入；
  # 同源反代 /object-storage/ 见 web/nginx.conf（直传预签名 URL 同源口径）。
  - minio.yaml
  # 审计事件流 Kafka（2026-11-19 新增，framework-stream 13.2）：单 broker KRaft 双监听器，
  # 集群内 kafka:29092 / 本地开发 EXTERNAL 公网 9092（地址经 app.env KAFKA_ADVERTISED_LISTENERS）
  - kafka.yaml
  - gateway.yaml
  - platform-auth.yaml
  - platform-infra.yaml
  - platform-system.yaml
  # 调度中心服务（REQ-20261121-071002 确认⑥：k8s/base 登记 + 镜像映射）
  - platform-scheduler.yaml
  - web.yaml
  - ingress.yaml
configMapGenerator:
  - name: acme-app-config
    literals:
      - NACOS_ADDR=http://nacos:8848
      - NACOS_USERNAME=nacos
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=acme
      - PG_USERNAME=acme
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Kafka（13.2 审计事件流）：集群内走 INTERNAL 监听器（headless DNS）
      - KAFKA_ADDR=kafka:29092
      # JVM 容器自适应：堆按容器限额的 70%，限 Metaspace 防 4G 机上超卖
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:MaxMetaspaceSize=96m
      # actuator 探针组（liveness/readiness）：platform-*.yml 已显式开启，网关 yml 未配，统一经环境变量兜底
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      # CORS 开发默认通配（网关 yml 语义）；prod overlay 必须覆盖为显式白名单
      - ACME_CORS_ALLOWED_ORIGINS=*
images:
  - name: acme/gateway
    newTag: latest
  - name: acme/platform-auth
    newTag: latest
  - name: acme/platform-infra
    newTag: latest
  - name: acme/platform-system
    newTag: latest
  - name: acme/platform-scheduler
    newTag: latest
  - name: acme/web
    newTag: latest
