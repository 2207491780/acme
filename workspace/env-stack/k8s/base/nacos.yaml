# Nacos —— 注册中心 + 配置中心，standalone（内嵌 derby），JVM 降配适配 4G 单机
# 注意：2.x 客户端走 gRPC 9848（= 8848 + 1000），Service 必须同时暴露。
# dev/test 关闭鉴权（集群内访问）；种子配置 data-id 由 scripts/seed-nacos.sh 推送。
apiVersion: v1
kind: Service
metadata:
  name: nacos
  labels:
    app: nacos
spec:
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: grpc
      port: 9848
      targetPort: 9848
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nacos
spec:
  serviceName: nacos
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      imagePullSecrets:
        - name: acme-registry-auth
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.4.3-slim
          env:
            - name: MODE
              value: standalone
            - name: NACOS_AUTH_ENABLE
              value: "false"
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 384m
            - name: JVM_XMN
              value: 128m
          ports:
            - containerPort: 8848
              name: http
            - containerPort: 9848
              name: grpc
          volumeMounts:
            - name: data
              mountPath: /home/nacos/data
          readinessProbe:
            httpGet:
              path: /nacos/v2/console/health/readiness
              port: 8848
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nacos/v2/console/health/liveness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # JVM(Xmx384m)+Metaspace+derby 实测超出 512Mi，会被 OOMKilled（exit 137）
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
