# acme-web —— nginx 静态站 + 同源反代网关（nginx.conf 已打进镜像）
apiVersion: v1
kind: Service
metadata:
  name: acme-web
  labels:
    app: acme-web
spec:
  selector:
    app: acme-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acme-web
  template:
    metadata:
      labels:
        app: acme-web
    spec:
      imagePullSecrets:
        - name: acme-registry-auth
      containers:
        - name: web
          image: acme/web
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
