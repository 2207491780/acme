# platform-auth-service（9882）—— PG schema platform_auth + Redis（验证码/防爆破）
apiVersion: v1
kind: Service
metadata:
  name: platform-auth
  labels:
    app: platform-auth
spec:
  selector:
    app: platform-auth
  ports:
    - name: http
      port: 9882
      targetPort: 9882
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-auth
  template:
    metadata:
      labels:
        app: platform-auth
    spec:
      imagePullSecrets:
        - name: acme-registry-auth
      containers:
        - name: auth
          image: acme/platform-auth
          envFrom:
            - configMapRef:
                name: acme-app-config
            - secretRef:
                name: acme-app-secrets
          env:
            # 服务级覆盖共享 acme-app-config 的 JAVA_TOOL_OPTIONS（k8s 规则：env 优先于 envFrom），
            # 范式同 platform-infra（ADR 26）。dev 实测（2026-11-14）：新镜像 auth 类量增长后，
            # 管理端验证码（Hutool LineCaptcha AWT 类懒加载）触发 OOM Metaspace 500；
            # 同批实测 platform-system 已到共享上限 96m 的 85%，一并按此范式定容（ADR 28）。
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=40 -XX:MaxMetaspaceSize=192m"
          ports:
            - containerPort: 9882
              name: http
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9882
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9882
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9882
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # 384Mi + 共享 JVM 参数下验证码首次访问即 OOM Metaspace（2026-11-14 dev），扩到 512Mi
              # 并按服务覆盖 JVM 参数（见上方 env 注释）；容量核算同 platform-infra（ADR 26）
              memory: 512Mi
