# RocketMQ broker 配置（仅开发用，poc-gate POC-3 多 binder 验证前置；消息约束见 Backend.md 13.2）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 宿主机侧应用（IDE 启动）经 127.0.0.1 映射端口连接：broker 向 nameserver 注册的地址必须是宿主机可达地址，
# 否则客户端拿到容器内网 IP 无法直连
brokerIP1 = 127.0.0.1
# 开发期允许自动建主题；正式主题治理见 Backend.md 13.2.4（按业务域设主题、消费组与服务名对应）
autoCreateTopicEnable = true
